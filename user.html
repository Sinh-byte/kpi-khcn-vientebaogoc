<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu KPI Nghiên cứu viên</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; }
        h1 { color: #4c51bf; font-size: 2.5em; margin-bottom: 10px; text-align: center; }
        .subtitle { color: #718096; text-align: center; margin-bottom: 40px; font-size: 1.1em; }
        .search-box { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 30px; margin-bottom: 30px; }
        label { display: block; font-weight: 600; color: #2d3748; margin-bottom: 10px; font-size: 1.1em; }
        input, select { width: 100%; padding: 15px 20px; font-size: 1.1em; border: 2px solid #cbd5e0; border-radius: 10px; transition: all 0.3s; }
        input:focus, select:focus { outline: none; border-color: #4c51bf; box-shadow: 0 0 0 3px rgba(76, 81, 191, 0.1); }
        button { width: 100%; padding: 15px; margin-top: 15px; font-size: 1.1em; font-weight: 600; color: white; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 10px; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-export { background: linear-gradient(135deg, #2f855a 0%, #276749 100%); }
        .info-box { background: #fef5e7; border-left: 4px solid #f39c12; padding: 15px; border-radius: 8px; margin-top: 20px; font-size: 0.95em; color: #7f6e0a; }
        .loading { text-align: center; color: #4c51bf; margin-top: 20px; font-size: 1.1em; }
        .result { margin-top: 40px; }
        .total-score { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 30px; }
        .total-score h2 { font-size: 1.2em; opacity: 0.9; margin-bottom: 10px; }
        .total-score .score { font-size: 3em; font-weight: bold; }
        .activities { max-height: 500px; overflow-y: auto; }
        .activity-card { background: #f7fafc; border-left: 4px solid #4c51bf; padding: 20px; margin-bottom: 15px; border-radius: 10px; transition: all 0.3s; }
        .activity-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); transform: translateX(5px); }
        .activity-title { color: #2d3748; font-size: 1.1em; font-weight: 600; margin-bottom: 8px; }
        .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .badge-category { background: #bee3f8; color: #2c5282; }
        .badge-quartile { background: #c6f6d5; color: #22543d; }
        .badge-role { background: #e9d8fd; color: #553c9a; }
        .activity-score { text-align: right; font-size: 2em; font-weight: bold; color: #4c51bf; }
        .back-button { background: #e2e8f0; color: #2d3748; margin-top: 20px; }
        .result-actions { display: flex; gap: 12px; margin-top: 20px; }
        .result-actions button { margin-top: 0; }
        .hidden { display: none; }
        .admin-link { text-align: center; margin-top: 20px; font-size: 0.9em; }
        .admin-link a { color: #4c51bf; text-decoration: none; }
        .error-message { background: #fed7d7; border-left: 4px solid #e53e3e; padding: 15px; border-radius: 8px; margin-top: 20px; color: #742a2a; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="searchView">
            <h1>🔍 Tra cứu KPI Nghiên cứu viên</h1>
            <p class="subtitle">Nhập họ tên để xem điểm KPI của bạn</p>
            <div class="search-box">
                <label for="yearSelect">Chọn năm tra cứu:</label>
                <select id="yearSelect" style="margin-bottom: 15px;">
                    <option value="">Đang tải...</option>
                </select>
                
                <label for="nameInput">Họ và tên của bạn:</label>
                <input type="text" id="nameInput" placeholder="Ví dụ: Phạm Văn Phúc" autocomplete="off">
                <button id="searchBtn">🔎 Xem điểm KPI của tôi</button>
                <div class="info-box">ℹ️ <strong>Lưu ý:</strong> Nhập chính xác họ tên như trong hồ sơ</div>
            </div>
            <div id="loadingMessage" class="loading hidden">⏳ Đang tải dữ liệu từ cơ sở dữ liệu...</div>
            <div id="errorMessage" class="error-message hidden"></div>
            <div class="admin-link">
                <a href="index.html">🔐 Đăng nhập quản trị</a>
            </div>
        </div>

        <div id="resultView" class="hidden result">
            <h1>👤 Thông tin KPI</h1>
            <p class="subtitle" id="userName"></p>
            <div class="total-score">
                <h2>Tổng điểm KPI</h2>
                <div class="score" id="totalScore">0 giờ</div>
                <div class="count" id="activityCount">0 hoạt động</div>
            </div>
            <h3 style="margin-bottom: 20px; color: #2d3748;">📋 Chi tiết các hoạt động:</h3>
            <div class="activities" id="activitiesList"></div>
            <div class="result-actions">
                <button id="exportWordBtn" class="btn-export">📄 Xuất hồ sơ Word</button>
                <button id="backBtn" class="back-button">← Tra cứu người khác</button>
            </div>
        </div>
    </div>

    <script>
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwb9fcZPwcG8QaX4AwrIfqAO7843xaXc2u7bTtioxK8sMcpz-XAadQHbLDlaBM0wdLc/exec';
        var cachedData = {};
        var availableYears = [];
        var lastSearchResult = null;
        var DOC_UNIT_NAME = 'VIỆN TẾ BÀO GỐC';
        var DOC_ORG_LINE = 'PHÒNG KHCN&QHĐN';
        var DOC_LOGO_URL = '';
        var DOC_SIGNER_ROLE = 'TP, PHÒNG KHCN&QHĐN';
        var DOC_SIGNER_NAME = 'NGUYỄN TRƯỜNG SINH';
        var DOC_SIGN_BLOCK_LEFT_INDENT = 5200;
        var DOC_SIGN_BLOCK_RIGHT_INDENT = 200;
        
        function loadAvailableYears() {
            console.log('Loading available years...');
            fetch(SCRIPT_URL)
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    availableYears = data.availableYears || [];
                    console.log('Available years:', availableYears);
                    
                    var yearSelect = document.getElementById('yearSelect');
                    yearSelect.innerHTML = '';
                    
                    if (availableYears.length === 0) {
                        yearSelect.innerHTML = '<option value="">Chưa có dữ liệu</option>';
                    } else {
                        availableYears.forEach(function(year) {
                            var option = document.createElement('option');
                            option.value = year;
                            option.textContent = 'Năm ' + year;
                            yearSelect.appendChild(option);
                        });
                    }
                })
                .catch(function(error) {
                    console.error('Error loading years:', error);
                    document.getElementById('yearSelect').innerHTML = '<option value="">Lỗi tải dữ liệu</option>';
                });
        }
        
        function normalizeName(name) {
            if (!name) return '';
            return name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]/g, '').trim();
        }

        function isSamePerson(name1, name2) {
            var n1 = normalizeName(name1);
            var n2 = normalizeName(name2);
            if (n1 === n2) return true;
            var words1 = name1.toLowerCase().split(/\s+/);
            var words2 = name2.toLowerCase().split(/\s+/);
            if (words1.length >= 2 && words2.length >= 2) {
                var first1 = normalizeName(words1[0]);
                var last1 = normalizeName(words1[words1.length - 1]);
                var first2 = normalizeName(words2[0]);
                var last2 = normalizeName(words2[words2.length - 1]);
                if ((first1 === last2 && last1 === first2) || (first1 === first2 && last1 === last2)) return true;
            }
            return false;
        }
        
        function loadFromGoogleSheets(year) {
            console.log('Fetching from:', SCRIPT_URL, 'for year:', year);
            var url = SCRIPT_URL + '?sheet=' + encodeURIComponent(year);
            
            return fetch(url)
                .then(function(response) {
                    console.log('Response status:', response.status);
                    if (!response.ok) throw new Error('Không thể tải dữ liệu');
                    return response.json();
                })
                .then(function(data) {
                    console.log('Data received:', data);
                    var rows = data.values || [];
                    console.log('Total rows:', rows.length);
                    if (rows.length < 2) return [];
                    
                    var activities = [];
                    for (var i = 1; i < rows.length; i++) {
                        var row = rows[i];
                        if (!row || row.length < 7) continue;
                        
                        activities.push({
                            year: row[0] || '',
                            stt: row[1] || '',
                            activityType: row[2] || '',
                            ranking: row[3] || '',
                            title: row[4] || '',
                            journal: row[5] || '',
                            authorName: row[6] || '',
                            role: row[7] || 'coauthor',
                            totalAuthors: parseInt(row[8]) || 1,
                            H: parseInt(row[9]) || 600,
                            score: parseInt(row[10]) || 0
                        });
                    }
                    
                    console.log('Activities parsed:', activities.length);
                    return activities;
                })
                .catch(function(error) {
                    console.error('Load error:', error);
                    throw error;
                });
        }

        function searchKPI() {
            var selectedYear = document.getElementById('yearSelect').value;
            if (!selectedYear) {
                alert('Vui lòng chọn năm tra cứu!');
                return;
            }
            
            var nameInput = document.getElementById('nameInput').value.trim();
            if (!nameInput) { 
                alert('Vui lòng nhập họ tên!'); 
                return; 
            }
            
            var searchBtn = document.getElementById('searchBtn');
            var loadingMsg = document.getElementById('loadingMessage');
            var errorMsg = document.getElementById('errorMessage');
            
            searchBtn.disabled = true;
            searchBtn.textContent = '⏳ Đang tìm kiếm...';
            loadingMsg.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            
            if (cachedData[selectedYear]) {
                console.log('Using cached data for year:', selectedYear);
                processSearch(nameInput, cachedData[selectedYear], selectedYear);
                return;
            }
            
            console.log('Loading fresh data for year:', selectedYear);
            loadFromGoogleSheets(selectedYear)
                .then(function(activities) {
                    console.log('Loaded activities:', activities.length);
                    cachedData[selectedYear] = activities;
                    processSearch(nameInput, cachedData[selectedYear], selectedYear);
                })
                .catch(function(error) {
                    console.error('Search error:', error);
                    loadingMsg.classList.add('hidden');
                    errorMsg.textContent = '❌ Lỗi: ' + error.message;
                    errorMsg.classList.remove('hidden');
                    searchBtn.disabled = false;
                    searchBtn.textContent = '🔎 Xem điểm KPI của tôi';
                });
        }
        
        function processSearch(nameInput, activities, year) {
            var searchBtn = document.getElementById('searchBtn');
            var loadingMsg = document.getElementById('loadingMessage');
            var errorMsg = document.getElementById('errorMessage');
            
            console.log('Processing search for:', nameInput, 'in year:', year);
            console.log('Total activities:', activities.length);
            
            if (!activities || activities.length === 0) {
                loadingMsg.classList.add('hidden');
                errorMsg.textContent = '⚠️ Chưa có dữ liệu trong năm ' + year + '.';
                errorMsg.classList.remove('hidden');
                searchBtn.disabled = false;
                searchBtn.textContent = '🔎 Xem điểm KPI của tôi';
                return;
            }
            
            var userActivities = activities.filter(function(a) { 
                var match = isSamePerson(a.authorName, nameInput);
                console.log('Comparing:', a.authorName, 'with', nameInput, '=', match);
                return match;
            });
            
            console.log('Found activities:', userActivities.length);
            loadingMsg.classList.add('hidden');
            
            if (userActivities.length === 0) { 
                errorMsg.textContent = '❌ Không tìm thấy dữ liệu cho tên "' + nameInput + '" trong năm ' + year;
                errorMsg.classList.remove('hidden');
                searchBtn.disabled = false;
                searchBtn.textContent = '🔎 Xem điểm KPI của tôi';
                return; 
            }
            
            displayResults(nameInput, userActivities, year, activities);
            searchBtn.disabled = false;
            searchBtn.textContent = '🔎 Xem điểm KPI của tôi';
        }

        function normalizeText(value) {
            return (value || '').toString().toLowerCase().trim().replace(/\s+/g, ' ');
        }

        function getActivityGroupKey(a) {
            return [
                normalizeText(a.title),
                normalizeText(a.journal),
                normalizeText(a.year),
                normalizeText(a.ranking),
                normalizeText(a.activityType),
                parseInt(a.H) || 600,
                parseInt(a.totalAuthors) || 1
            ].join('||');
        }

        function buildAuthorMap(allActivities) {
            var map = {};
            (allActivities || []).forEach(function(item) {
                var key = getActivityGroupKey(item);
                if (!map[key]) map[key] = [];
                if (item.authorName && map[key].indexOf(item.authorName) === -1) {
                    map[key].push(item.authorName);
                }
            });
            return map;
        }

        function getActivityType(a) {
            var activityType = (a.activityType || '').toString().trim();
            if (activityType) return activityType;
            return 'Hoạt động KHCN';
        }

        function escapeHtml(text) {
            return (text || '').toString()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function loadScript(src) {
            return new Promise(function(resolve, reject) {
                var script = document.createElement('script');
                script.src = src;
                script.async = true;
                script.onload = function() { resolve(); };
                script.onerror = function() { reject(new Error('Không tải được: ' + src)); };
                document.head.appendChild(script);
            });
        }

        async function ensureDocxLibrary() {
            if (window.docx) return true;
            var sources = [
                'https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js',
                'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js',
                'https://unpkg.com/docx@8.5.0/build/index.umd.js'
            ];
            for (var i = 0; i < sources.length; i++) {
                try {
                    await loadScript(sources[i]);
                    if (window.docx) return true;
                } catch (e) {
                    console.warn(e.message);
                }
            }
            return false;
        }

        function saveBlobFile(blob, filename) {
            var url = URL.createObjectURL(blob);
            var link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function getAuthorNamesForActivity(activity, allActivities, authorMap) {
            var authorNames = authorMap[getActivityGroupKey(activity)] || [];
            if (authorNames.length <= 1) {
                var fallbackByTitle = (allActivities || []).filter(function(item) {
                    return normalizeText(item.title) === normalizeText(activity.title) &&
                           normalizeText(item.year) === normalizeText(activity.year);
                });
                authorNames = [];
                fallbackByTitle.forEach(function(item) {
                    if (item.authorName && authorNames.indexOf(item.authorName) === -1) {
                        authorNames.push(item.authorName);
                    }
                });
            }
            if (authorNames.length === 0 && activity.authorName) {
                authorNames.push(activity.authorName);
            }
            return authorNames;
        }

        function getScoreFormulaText(activity) {
            var H = parseInt(activity.H) || 600;
            var A = parseInt(activity.totalAuthors) || 1;
            var K = 1;
            if (A === 1) {
                return 'Tác giả duy nhất: ' + H + 'h';
            }
            if (activity.role === 'first' || activity.role === 'corresponding' || activity.role === 'last') {
                var part1 = Math.round((H * 1 / 3) * (1 / K));
                var part2 = Math.round((H * 2 / 3) * (1 / A));
                return 'Vai trò chính: (1/3 x ' + H + ') x (1/' + K + ') = ' + part1 + 'h; ' +
                       'Nhóm tác giả: (2/3 x ' + H + ') x (1/' + A + ') = ' + part2 + 'h; ' +
                       'Tổng: ' + (part1 + part2) + 'h';
            }
            var partCoAuthor = Math.round((H * 2 / 3) * (1 / A));
            return 'Đồng tác giả: (2/3 x ' + H + ') x (1/' + A + ') = ' + partCoAuthor + 'h';
        }

        async function exportToWord() {
            if (!lastSearchResult || !lastSearchResult.activities || lastSearchResult.activities.length === 0) {
                alert('Chưa có dữ liệu để xuất. Vui lòng tra cứu trước.');
                return;
            }
            var libraryReady = await ensureDocxLibrary();
            if (!libraryReady || !window.docx) {
                alert('Không tải được thư viện xuất DOCX. Vui lòng kiểm tra kết nối mạng và thử lại.');
                return;
            }

            var name = lastSearchResult.name || 'NguoiDung';
            var year = lastSearchResult.year || '';
            var activities = lastSearchResult.activities;
            var allActivities = lastSearchResult.allActivities || [];
            var authorMap = buildAuthorMap(allActivities);
            var totalScore = activities.reduce(function(sum, a) { return sum + (a.score || 0); }, 0);
            var roleNames = { first: 'Tác giả chính', corresponding: 'Tác giả liên hệ', last: 'Tác giả cuối', coauthor: 'Đồng tác giả' };
            var d = window.docx;
            var now = new Date();
            var dateTimeText = now.toLocaleString('vi-VN');

            var logoImageRun = null;
            if (DOC_LOGO_URL) {
                try {
                    var logoRes = await fetch(DOC_LOGO_URL);
                    var logoBuffer = await logoRes.arrayBuffer();
                    logoImageRun = new d.ImageRun({
                        data: logoBuffer,
                        transformation: { width: 60, height: 60 }
                    });
                } catch (err) {
                    console.warn('Không tải được logo:', err);
                }
            }

            var tableHeaderLabels = [
                { text: 'STT', width: 5 },
                { text: 'Tên công trình', width: 20 },
                { text: 'Tên tạp chí', width: 13 },
                { text: 'Loại hoạt động', width: 8 },
                { text: 'Xếp hạng', width: 7 },
                { text: 'Vai trò', width: 7 },
                { text: 'Danh sách tác giả', width: 12 },
                { text: 'H tối đa', width: 6 },
                { text: 'Điểm', width: 6 },
                { text: 'Công thức tính điểm', width: 16 }
            ];

            var headerCells = tableHeaderLabels.map(function(col) {
                    return new d.TableCell({
                        width: { size: col.width, type: d.WidthType.PERCENTAGE },
                        children: [new d.Paragraph({
                            children: [new d.TextRun({ text: col.text, bold: true, size: 22 })]
                        })]
                    });
                });

            var tableRows = [
                new d.TableRow({ children: headerCells })
            ];

            activities.forEach(function(a, index) {
                var rankingText = (a.ranking || '').toString().trim() || 'Chưa có';
                var H = parseInt(a.H) || 600;
                var roleName = roleNames[a.role] || a.role || 'Chưa xác định';
                var activityType = getActivityType(a);
                var authorNames = getAuthorNamesForActivity(a, allActivities, authorMap);
                var formulaText = getScoreFormulaText(a);

                var authorParts = [];
                authorNames.forEach(function(author, idx) {
                    if (idx > 0) authorParts.push({ text: ', ', bold: false });
                    authorParts.push({ text: author, bold: isSamePerson(author, name) });
                });
                if (authorParts.length === 0) authorParts.push({ text: '', bold: false });

                tableRows.push(
                    new d.TableRow({
                        children: [
                            new d.TableCell({ children: [new d.Paragraph({ children: [new d.TextRun({ text: String(index + 1), size: 22 })] })] }),
                            new d.TableCell({ children: [new d.Paragraph({ children: [new d.TextRun({ text: a.title || 'Không có tiêu đề', size: 22 })] })] }),
                            new d.TableCell({ children: [new d.Paragraph({ children: [new d.TextRun({ text: a.journal || '', size: 22 })] })] }),
                            new d.TableCell({ children: [new d.Paragraph({ children: [new d.TextRun({ text: activityType, size: 22 })] })] }),
                            new d.TableCell({ children: [new d.Paragraph({ children: [new d.TextRun({ text: rankingText, size: 22 })] })] }),
                            new d.TableCell({ children: [new d.Paragraph({ children: [new d.TextRun({ text: roleName, size: 22 })] })] }),
                            new d.TableCell({ children: [new d.Paragraph({ children: authorParts.map(function(part) {
                                return new d.TextRun({ text: part.text || '', bold: !!part.bold, size: 22 });
                            }) })] }),
                            new d.TableCell({ children: [new d.Paragraph({ children: [new d.TextRun({ text: String(H), size: 22 })] })] }),
                            new d.TableCell({ children: [new d.Paragraph({ children: [new d.TextRun({ text: String(a.score || 0), size: 22 })] })] }),
                            new d.TableCell({ children: [new d.Paragraph({ children: [new d.TextRun({ text: formulaText, size: 22 })] })] })
                        ]
                    })
                );
            });

            var doc = new d.Document({
                styles: {
                    default: {
                        document: {
                            run: {
                                font: 'Times New Roman',
                                size: 26
                            }
                        }
                    }
                },
                sections: [{
                    properties: {
                        page: {
                            margin: {
                                top: 1134,
                                right: 1134,
                                bottom: 1134,
                                left: 1701
                            }
                        }
                    },
                    footers: {
                        default: new d.Footer({
                            children: [
                                new d.Paragraph({
                                    alignment: d.AlignmentType.RIGHT,
                                    children: [
                                        new d.TextRun('Trang '),
                                        d.PageNumber.CURRENT,
                                        new d.TextRun(' / '),
                                        d.PageNumber.TOTAL_PAGES
                                    ]
                                })
                            ]
                        })
                    },
                    children: [
                        new d.Table({
                            width: { size: 100, type: d.WidthType.PERCENTAGE },
                            borders: {
                                top: { style: d.BorderStyle.SINGLE, size: 6, color: 'A6A6A6' },
                                bottom: { style: d.BorderStyle.SINGLE, size: 6, color: 'A6A6A6' },
                                left: { style: d.BorderStyle.SINGLE, size: 6, color: 'A6A6A6' },
                                right: { style: d.BorderStyle.SINGLE, size: 6, color: 'A6A6A6' },
                                insideHorizontal: { style: d.BorderStyle.SINGLE, size: 6, color: 'A6A6A6' },
                                insideVertical: { style: d.BorderStyle.SINGLE, size: 6, color: 'A6A6A6' }
                            },
                            rows: [
                                new d.TableRow({
                                    children: [
                                        new d.TableCell({
                                            width: { size: 45, type: d.WidthType.PERCENTAGE },
                                            children: [
                                                new d.Paragraph({
                                                    spacing: { after: 60 },
                                                            children: logoImageRun ? [logoImageRun] : [new d.TextRun({ text: '[Logo đơn vị]', italics: true, size: 24, color: '7A7A7A' })]
                                                }),
                                                new d.Paragraph({
                                                    alignment: d.AlignmentType.CENTER,
                                                    spacing: { after: 40 },
                                                            children: [new d.TextRun({ text: DOC_UNIT_NAME, bold: true, allCaps: true, size: 24, color: '7A7A7A' })]
                                                }),
                                                new d.Paragraph({
                                                    alignment: d.AlignmentType.CENTER,
                                                    spacing: { after: 40 },
                                                            children: [new d.TextRun({ text: DOC_ORG_LINE, bold: true, allCaps: true, size: 24, color: '7A7A7A' })]
                                                })
                                            ]
                                        }),
                                        new d.TableCell({
                                            width: { size: 55, type: d.WidthType.PERCENTAGE },
                                            children: [
                                                new d.Paragraph({
                                                    alignment: d.AlignmentType.CENTER,
                                                    spacing: { after: 30 },
                                                    children: [new d.TextRun({ text: 'CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM', bold: true, allCaps: true, size: 24, color: '7A7A7A' })]
                                                }),
                                                new d.Paragraph({
                                                    alignment: d.AlignmentType.CENTER,
                                                    spacing: { after: 50 },
                                                    children: [new d.TextRun({ text: 'Độc lập - Tự do - Hạnh phúc', bold: true, size: 24, color: '7A7A7A' })]
                                                }),
                                                new d.Paragraph({
                                                    alignment: d.AlignmentType.CENTER,
                                                    spacing: { after: 20 },
                                                    border: {
                                                        bottom: { color: '7A7A7A', space: 1, style: d.BorderStyle.SINGLE, size: 8 }
                                                    },
                                                    children: [new d.TextRun('')]
                                                })
                                            ]
                                        })
                                    ]
                                })
                            ]
                        }),
                        new d.Paragraph({ spacing: { after: 20 }, children: [new d.TextRun('')] }),
                        new d.Paragraph({
                            alignment: d.AlignmentType.CENTER,
                            spacing: { before: 60, after: 180 },
                            children: [
                                new d.TextRun({
                                    text: 'HỒ SƠ HOẠT ĐỘNG KHOA HỌC CÔNG NGHỆ NĂM ' + year,
                                    bold: true,
                                    color: '2F75B5',
                                    allCaps: true,
                                    size: 24
                                })
                            ]
                        }),
                        new d.Paragraph({
                            alignment: d.AlignmentType.RIGHT,
                            spacing: { after: 120 },
                            children: [new d.TextRun({ text: 'Ngày ' + now.getDate() + ' tháng ' + (now.getMonth() + 1) + ' năm ' + now.getFullYear(), italics: true, size: 24 })]
                        }),
                        new d.Paragraph({ spacing: { after: 20 }, children: [new d.TextRun({ text: 'Họ và tên: ', bold: true, size: 24 }), new d.TextRun({ text: name, size: 24, allCaps: true })] }),
                        new d.Paragraph({ spacing: { after: 20 }, children: [new d.TextRun({ text: 'Năm kê khai: ', bold: true, size: 24 }), new d.TextRun({ text: String(year), size: 24 })] }),
                        new d.Paragraph({ spacing: { after: 30 }, children: [new d.TextRun({ text: 'Ngày xuất: ', bold: true, size: 24 }), new d.TextRun({ text: dateTimeText, size: 24 })] }),
                        new d.Paragraph({
                            spacing: { after: 180 },
                            children: [
                                new d.TextRun({ text: 'Tổng điểm KPI: ', bold: true, size: 24 }),
                                new d.TextRun({ text: totalScore.toLocaleString() + ' giờ', size: 24 }),
                                new d.TextRun({ text: ' | ', size: 24 }),
                                new d.TextRun({ text: 'Tổng số hoạt động: ', bold: true, size: 24 }),
                                new d.TextRun({ text: String(activities.length), size: 24 })
                            ]
                        }),
                        new d.Paragraph({ text: 'I. Danh sách chi tiết hoạt động', heading: d.HeadingLevel.HEADING_2 }),
                        new d.Table({
                            rows: tableRows,
                            width: { size: 100, type: d.WidthType.PERCENTAGE }
                        }),
                        new d.Paragraph(''),
                        new d.Paragraph({
                            alignment: d.AlignmentType.CENTER,
                            indent: { left: DOC_SIGN_BLOCK_LEFT_INDENT, right: DOC_SIGN_BLOCK_RIGHT_INDENT },
                            spacing: { before: 120, after: 80 },
                            children: [new d.TextRun({ text: 'Người lập biểu', bold: true, size: 22 })]
                        }),
                        new d.Paragraph({
                            alignment: d.AlignmentType.CENTER,
                            indent: { left: DOC_SIGN_BLOCK_LEFT_INDENT, right: DOC_SIGN_BLOCK_RIGHT_INDENT },
                            spacing: { after: 120 },
                            children: [new d.TextRun({ text: DOC_SIGNER_ROLE, bold: true, size: 22 })]
                        }),
                        new d.Paragraph({
                            alignment: d.AlignmentType.CENTER,
                            indent: { left: DOC_SIGN_BLOCK_LEFT_INDENT, right: DOC_SIGN_BLOCK_RIGHT_INDENT },
                            spacing: { before: 1400, after: 0 },
                            children: [new d.TextRun({ text: DOC_SIGNER_NAME, bold: true, allCaps: true, size: 22 })]
                        })
                    ]
                }]
            });

            try {
                var blob = await d.Packer.toBlob(doc);
                var safeName = normalizeName(name) || 'ho_so';
                var filename = 'ho-so-khcn-' + safeName + '-' + year + '.docx';
                saveBlobFile(blob, filename);
            } catch (error) {
                alert('Không thể xuất DOCX: ' + error.message);
            }
        }

        function displayResults(name, activities, year, allActivities) {
            document.getElementById('searchView').classList.add('hidden');
            document.getElementById('resultView').classList.remove('hidden');
            document.getElementById('userName').textContent = name + ' - Năm ' + year;
            var totalScore = activities.reduce(function(sum, a) { return sum + (a.score || 0); }, 0);
            document.getElementById('totalScore').textContent = totalScore.toLocaleString() + ' giờ';
            document.getElementById('activityCount').textContent = activities.length + ' hoạt động';
            var authorMap = buildAuthorMap(allActivities);
            lastSearchResult = {
                name: name,
                year: year,
                activities: activities,
                allActivities: allActivities
            };
            
            var listHTML = activities.map(function(a) {
                var roleNames = { first: 'Tác giả chính', corresponding: 'Tác giả liên hệ', last: 'Tác giả cuối', coauthor: 'Đồng tác giả' };
                var activityType = getActivityType(a);
                
                var roleName = roleNames[a.role] || '';
                var rankingText = (a.ranking || '').toString().trim();
                var rankingBadge = rankingText ? '<span class="badge badge-quartile">Xếp hạng: ' + rankingText + '</span>' : '';
                
                var H = parseInt(a.H) || 600;
                var A = parseInt(a.totalAuthors) || 1;
                
                var formula = '';
                if (A === 1) {
                    formula = 'Tác giả duy nhất: ' + H + 'h';
                } else {
                    var K = 1;
                    
                    if (a.role === 'first' || a.role === 'corresponding' || a.role === 'last') {
                        var part1 = Math.round((H * 1/3) * (1/K));
                        var part2 = Math.round((H * 2/3) * (1/A));
                        formula = '<strong>Tác giả chính thuộc Viện:</strong><br/>' +
                                 'Phần vai trò chính: (1/3 × ' + H + ') × (1/' + K + ') = ' + part1 + 'h<br/>' +
                                 'Phần chia theo nhóm tác giả: (2/3 × ' + H + ') × (1/' + A + ') = ' + part2 + 'h<br/>' +
                                 '<strong>Tổng: ' + (part1 + part2) + 'h</strong>';
                    } else {
                        var part2 = Math.round((H * 2/3) * (1/A));
                        formula = '<strong>Đồng tác giả thuộc Viện:</strong><br/>' +
                                 'Phần chia theo nhóm tác giả: (2/3 × ' + H + ') × (1/' + A + ') = ' + part2 + 'h';
                    }
                }
                
                var journalInfo = a.journal ? '<div style="color:#718096;font-size:0.9em;margin-bottom:10px">' + a.journal + (a.year ? ' (' + a.year + ')' : '') + '</div>' : '';
                var quartileBadge = a.quartile ? '<span class="badge badge-quartile">' + a.quartile + '</span>' : '';
                var roleBadge = roleName ? '<span class="badge badge-role">' + roleName + '</span>' : '';
                
                var authorNames = getAuthorNamesForActivity(a, allActivities, authorMap);
                
                var formattedAuthorNames = authorNames.map(function(author) {
                    if (isSamePerson(author, name)) {
                        return '<strong style="color:#2d3748;">' + author + '</strong>';
                    }
                    return author;
                });

                var authorListHtml = authorNames.length > 0
                    ? '<div style="color:#4a5568;font-size:0.9em;margin:8px 0 10px;"><strong>Tác giả:</strong> ' + formattedAuthorNames.join(', ') + '</div>'
                    : '';
                var authorBadge = authorNames.length > 1 ? '<span class="badge">' + authorNames.length + ' tác giả</span>' : '';
                var detailInfoHtml = '<div style="color:#4a5568;font-size:0.9em;line-height:1.6;margin:6px 0 10px;">' +
                    '<div><strong>Loại hoạt động:</strong> ' + (a.activityType || activityType) + '</div>' +
                    '<div><strong>Xếp hạng:</strong> ' + (rankingText || 'Chưa có') + '</div>' +
                    '<div><strong>Vai trò:</strong> ' + (roleName || a.role || 'Chưa xác định') + '</div>' +
                    '<div><strong>H tối đa:</strong> ' + H + ' giờ</div>' +
                '</div>';
                
                return '<div class="activity-card">' +
                    '<div class="activity-title">' + (a.title || 'Không có tiêu đề') + '</div>' +
                    journalInfo +
                    '<div class="badges">' +
                        '<span class="badge badge-category">' + activityType + '</span>' +
                        rankingBadge +
                        quartileBadge +
                        roleBadge +
                        authorBadge +
                    '</div>' +
                    authorListHtml +
                    detailInfoHtml +
                    '<div style="background:#dfe8ff;border:1px solid #b8c8ff;padding:12px;border-radius:8px;margin:10px 0;font-size:0.85em;color:#2f4aa0;line-height:1.6;">' +
                        '<div style="font-weight:600;margin-bottom:5px;">📐 Công thức tính điểm:</div>' +
                        '<div style="font-family:monospace;">' + formula + '</div>' +
                    '</div>' +
                    '<div class="activity-score">' + (a.score || 0).toLocaleString() + ' giờ</div>' +
                '</div>';
            }).join('');
            document.getElementById('activitiesList').innerHTML = listHTML;
        }

        function goBack() {
            document.getElementById('searchView').classList.remove('hidden');
            document.getElementById('resultView').classList.add('hidden');
            document.getElementById('nameInput').value = '';
            document.getElementById('errorMessage').classList.add('hidden');
        }

        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchKPI();
        });
        
        document.getElementById('searchBtn').addEventListener('click', searchKPI);
        document.getElementById('backBtn').addEventListener('click', goBack);
        document.getElementById('exportWordBtn').addEventListener('click', exportToWord);
        
        loadAvailableYears();
        
        console.log('Script loaded. SCRIPT_URL:', SCRIPT_URL);
    </script>
</body>
